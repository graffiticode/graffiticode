[package]
name = "graffiticode-l0187"
version = "0.1.0"
description = "L0187 — declarative FigJam boards in Graffiticode, built on L0000"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emit"
path = "src/bin/emit.rs"

[dependencies]
async-trait = "0.1"
graffiticode-l0000 = { path = "../../../l0000/crates/core", default-features = false }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
