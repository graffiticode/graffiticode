steps:
  # Build Docker image (the Dockerfile installs deps via `npm ci` on node:22-alpine,
  # matching the lockfile — no redundant top-level install on a mismatched node:latest).
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/graffiticode/l0179:$COMMIT_SHA'
      - '.'

  # Push image to Container Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'gcr.io/graffiticode/l0179:$COMMIT_SHA'
    id: Push

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - run
      - deploy
      - l0179
      - '--platform=managed'
      - '--image=gcr.io/graffiticode/l0179:$COMMIT_SHA'
      - >-
        --labels=commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - '--region=$_DEPLOY_REGION'
      - '--quiet'
      # AUTH_URL is the only runtime env this language needs, matching L0166:
      # spreadsheets read task data via `get-val-public` and params, never
      # `get-val-private`, so no GRAFFITICODE_SECRET_KEY is required. If a
      # private value is ever introduced, add the secret here AND propagate it
      # with console/scripts/set-compiler-secret.sh 0179 — never by hand.
      - '--set-env-vars=AUTH_URL=$_AUTH_URL'
      - '--allow-unauthenticated'
    id: Deploy
    entrypoint: gcloud

images:
  - 'gcr.io/graffiticode/l0179:$COMMIT_SHA'

options:
  substitutionOption: ALLOW_LOOSE

substitutions:
  _DEPLOY_REGION: us-central1
  _AUTH_URL: https://auth.graffiticode.org

tags:
  - l0179
