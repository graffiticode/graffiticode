[package]
name = "l0013-capture"
version = "0.1.0"
description = "The side-effecting half of L0013: render a form in headless Chrome, crop it, upload the PNG"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chromiumoxide = { version = "0.9.1", default-features = false }
futures-util = "0.3.34"
gcp_auth = "0.12.7"
graffiticode-l0013 = { path = "../core" }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde_json = "1"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1.53.3", features = ["time", "process", "macros", "rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8.9", features = ["query"] }
tokio = { version = "1.53.3", features = ["net", "macros", "rt-multi-thread"] }
