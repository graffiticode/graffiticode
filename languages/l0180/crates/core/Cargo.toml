[package]
name = "graffiticode-l0180"
version = "0.1.0"
description = "L0180 — quizzes and assessment items in Graffiticode, built on L0000"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
indexmap = "2"
graffiticode-l0000 = { path = "../../../l0000/crates/core", default-features = false }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
