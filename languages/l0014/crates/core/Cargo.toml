[package]
name = "graffiticode-l0014"
version = "0.1.0"
description = "L0014 — a Graffiticode dialect for authoring TransLaTeX rule sets, built on L0000"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
graffiticode-l0000 = { path = "../../../l0000/crates/core", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
