[package]
name = "l0000r-server"
version = "0.1.0"
description = "L0000 language server in Rust: /compile, /form, and the public static assets"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "l0000r_server"

[[bin]]
name = "l0000r"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json", "query"] }
graffiticode-l0000 = { path = "../core" }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
aws-lc-rs = "1"
base64 = "0.22"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
