[package]
name = "graffiticode-l0182"
version = "0.1.0"
description = "L0182 — surveys (ranked choice and rating scales) in Graffiticode, built on L0000"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
async-trait = "0.1"
fastrand = "2"
graffiticode-l0000 = { path = "../../../l0000/crates/core", default-features = false }
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
