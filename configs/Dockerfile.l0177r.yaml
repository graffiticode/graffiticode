# l0177r — the L0177 language server in Rust — from the monorepo root (deploy CLI, or
# `docker build -f configs/Dockerfile.l0177r.yaml .`). languages/l0177 holds both
# implementations: this image is the Rust server (crates/), which builds on the kernel and
# server crates in languages/l0000, with the static assets this language's npm packages build.
# configs/Dockerfile.l0177.yaml builds the TypeScript server from the same directory.

# Public static assets (spec documents, schema, language info) and the /form View bundle.
FROM node:22-alpine AS static
WORKDIR /src
COPY languages/l0177/package*.json ./
COPY languages/l0177/packages/core/package*.json ./packages/core/
COPY languages/l0177/packages/api/package*.json ./packages/api/
COPY languages/l0177/packages/view/package*.json ./packages/view/
RUN npm ci
COPY languages/l0177/tsconfig.base.json ./
COPY languages/l0177/packages ./packages
COPY languages/l0177/tools ./tools
RUN node tools/assemble-static.mjs --skip-install

FROM rust:1.99-bookworm AS server
WORKDIR /src/languages/l0177
COPY languages/l0000/Cargo.toml /src/languages/l0000/Cargo.toml
COPY languages/l0000/crates /src/languages/l0000/crates
COPY languages/l0177/Cargo.toml languages/l0177/Cargo.lock ./
COPY languages/l0177/crates ./crates
RUN cargo build --release --locked -p l0177r-server

FROM gcr.io/distroless/cc-debian12:nonroot
WORKDIR /app
COPY --from=server /src/languages/l0177/target/release/l0177r ./l0177r
COPY --from=static /src/static ./static
ENV STATIC_DIR=/app/static
EXPOSE 8080
CMD ["/app/l0177r"]
