# l0186r — the L0186 language server in Rust — from the monorepo root (deploy CLI, or
# `docker build -f configs/Dockerfile.l0186r.yaml .`). languages/l0186 holds both
# implementations: this image is the Rust server (crates/), which builds on the kernel and
# server crates in languages/l0000, with the static assets this language's npm packages build.
# configs/Dockerfile.l0186.yaml builds the TypeScript server from the same directory.

# Public static assets (spec documents, schema, language info) and the /form View bundle.
FROM node:22-alpine AS static
WORKDIR /src
COPY languages/l0186/package*.json ./
COPY languages/l0186/packages/core/package*.json ./packages/core/
COPY languages/l0186/packages/api/package*.json ./packages/api/
COPY languages/l0186/packages/view/package*.json ./packages/view/
RUN npm ci
COPY languages/l0186/tsconfig.base.json ./
COPY languages/l0186/packages ./packages
COPY languages/l0186/tools ./tools
RUN node tools/assemble-static.mjs --skip-install

FROM rust:1.99-bookworm AS server
WORKDIR /src/languages/l0186
COPY languages/l0000/Cargo.toml /src/languages/l0000/Cargo.toml
COPY languages/l0000/crates /src/languages/l0000/crates
COPY languages/l0186/Cargo.toml languages/l0186/Cargo.lock ./
COPY languages/l0186/crates ./crates
RUN cargo build --release --locked -p l0186r-server

FROM gcr.io/distroless/cc-debian12:nonroot
WORKDIR /app
COPY --from=server /src/languages/l0186/target/release/l0186r ./l0186r
COPY --from=static /src/static ./static
ENV STATIC_DIR=/app/static
EXPOSE 8080
CMD ["/app/l0186r"]
