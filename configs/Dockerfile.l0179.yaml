# l0179 from the monorepo root (deploy CLI). languages/l0179 is a self-contained
# npm project; its own Dockerfile builds the same image from that directory.
FROM node:22-alpine

WORKDIR /usr/src/app

COPY languages/l0179/ ./
RUN npm ci && npm run build && npm prune --omit=dev

ENV NODE_ENV=production
EXPOSE 50179
CMD ["npm", "start"]
