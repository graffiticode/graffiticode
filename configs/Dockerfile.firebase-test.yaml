# The image Cloud Build runs the emulator-backed test steps in (auth, api):
# the same Node as the build and runtime images, plus the Java the Firebase
# emulators need. firebase-tools itself comes from the repo's node_modules,
# so its version is the lockfile's, not the image's.
#
# Build and pin (digest goes in deploy.json and configs/cloudbuild.*.yaml):
#   gcloud builds submit configs --project graffiticode --config configs/cloudbuild.firebase-test.yaml
FROM node:22.23.3@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
RUN apt-get update \
  && apt-get install -y --no-install-recommends openjdk-17-jre-headless \
  && rm -rf /var/lib/apt/lists/* \
  && java -version
ENTRYPOINT ["npm"]
