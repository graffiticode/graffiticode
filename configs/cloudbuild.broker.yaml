# Build only. Normal releases use npm run deploy -- broker.
# Direct submission requires _IMAGE, _RELEASE and --service-account.
steps:
  - name: node:22
    entrypoint: npm
    args:
      - ci
  - name: node:22
    entrypoint: npm
    args:
      - test
      - -w
      - packages/common
      - --
      - --runInBand
  - name: node:22
    entrypoint: npm
    args:
      - test
      - -w
      - packages/deploy
  - name: node:22
    entrypoint: npm
    args:
      - test
      - -w
      - packages/policy
  - name: node:22
    entrypoint: npm
    args:
      - test
      - -w
      - packages/broker
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:${_RELEASE}
      - -f
      - configs/Dockerfile.broker.yaml
      - .
images:
  - ${_IMAGE}:${_RELEASE}
options:
  requestedVerifyOption: VERIFIED
  logging: GCS_ONLY
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
