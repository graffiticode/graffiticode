# l0010r — the L0010 language server in Rust — from the monorepo root (deploy CLI, or
# `docker build -f configs/Dockerfile.l0010r.yaml .`). The dialect lives in languages/l0010r and
# builds on the kernel and server in languages/l0000r; its static assets are built by the
# TypeScript project in languages/l0010.

# Public static assets (spec documents, schema, language info) and the /form View bundle.
FROM node:22-alpine AS static
WORKDIR /src/languages/l0010
COPY languages/l0010/package*.json ./
COPY languages/l0010/packages/core/package*.json ./packages/core/
COPY languages/l0010/packages/api/package*.json ./packages/api/
COPY languages/l0010/packages/view/package*.json ./packages/view/
RUN npm ci
COPY languages/l0010/ ./
COPY languages/l0010r/tools /src/languages/l0010r/tools
RUN node /src/languages/l0010r/tools/build-static.mjs --skip-install

FROM rust:1.99-bookworm AS server
WORKDIR /src/languages/l0010r
COPY languages/l0000r/Cargo.toml /src/languages/l0000r/Cargo.toml
COPY languages/l0000r/crates /src/languages/l0000r/crates
COPY languages/l0010r/Cargo.toml languages/l0010r/Cargo.lock ./
COPY languages/l0010r/crates ./crates
RUN cargo build --release --locked -p l0010r-server

FROM gcr.io/distroless/cc-debian12:nonroot
WORKDIR /app
COPY --from=server /src/languages/l0010r/target/release/l0010r ./l0010r
COPY --from=static /src/languages/l0010r/static ./static
ENV STATIC_DIR=/app/static
EXPOSE 8080
CMD ["/app/l0010r"]
