# l0176r — the L0176 language server in Rust — from the monorepo root (deploy CLI, or
# `docker build -f configs/Dockerfile.l0176r.yaml .`). languages/l0176 holds both
# implementations: this image is the Rust server (crates/), which builds on the kernel and
# server crates in languages/l0000, with the static assets this language's npm packages build.
# configs/Dockerfile.l0176.yaml builds the TypeScript server from the same directory.

# Public static assets (spec documents, schema, language info) and the /form View bundle.
FROM node:22-alpine AS static
WORKDIR /src
COPY languages/l0176/package*.json ./
COPY languages/l0176/packages/core/package*.json ./packages/core/
COPY languages/l0176/packages/api/package*.json ./packages/api/
COPY languages/l0176/packages/view/package*.json ./packages/view/
RUN npm ci
COPY languages/l0176/tsconfig.base.json ./
COPY languages/l0176/packages ./packages
COPY languages/l0176/tools ./tools
RUN node tools/assemble-static.mjs --skip-install

FROM rust:1.99-bookworm AS server
WORKDIR /src/languages/l0176
COPY languages/l0000/Cargo.toml /src/languages/l0000/Cargo.toml
COPY languages/l0000/crates /src/languages/l0000/crates
COPY languages/l0176/Cargo.toml languages/l0176/Cargo.lock ./
COPY languages/l0176/crates ./crates
RUN cargo build --release --locked -p l0176r-server

FROM gcr.io/distroless/cc-debian12:nonroot
WORKDIR /app
COPY --from=server /src/languages/l0176/target/release/l0176r ./l0176r
COPY --from=static /src/static ./static
ENV STATIC_DIR=/app/static
EXPOSE 8080
CMD ["/app/l0176r"]
