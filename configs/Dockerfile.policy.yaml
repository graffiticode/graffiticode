# Build stage: a full install (tsc is a devDependency) and the tsc build of
# packages/*/dist. Nothing loads dist/ yet: CMD still runs src/ (TS migration
# phase 2a); the explicit copies below put exactly the packages this service
# loads into the image. The build context never contains dist/ (.dockerignore).
FROM node:22.23.3@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7 AS build
WORKDIR /usr/src/app
COPY . .
RUN npm ci && npm run build

FROM node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 AS runtime

WORKDIR /usr/src/app

ENV NODE_ENV=production

# git: learnosity-sdk-nodejs is installed from GitHub.
RUN apk add --no-cache git
COPY . .
RUN npm ci --omit=dev
COPY --from=build /usr/src/app/packages/common/dist packages/common/dist
COPY --from=build /usr/src/app/packages/auth/dist packages/auth/dist
COPY --from=build /usr/src/app/packages/policy/dist packages/policy/dist

EXPOSE 8080
CMD [ "node", "packages/policy/src/main.js" ]
