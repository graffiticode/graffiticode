# l0000r — the L0000 language server in Rust — from the monorepo root (deploy CLI, or
# `docker build -f configs/Dockerfile.l0000r.yaml .`). languages/l0000 holds both
# implementations: this image is the Rust server (crates/) with the static assets its npm
# packages build. configs/Dockerfile.l0000.yaml builds the TypeScript server from the same
# directory.

# Public static assets (spec documents, schema, language info) and the /form View bundle.
FROM node:22-alpine AS static
WORKDIR /src
COPY languages/l0000/package*.json ./
COPY languages/l0000/packages/core/package*.json ./packages/core/
COPY languages/l0000/packages/api/package*.json ./packages/api/
COPY languages/l0000/packages/view/package*.json ./packages/view/
RUN npm ci
COPY languages/l0000/tsconfig.base.json ./
COPY languages/l0000/packages ./packages
COPY languages/l0000/tools ./tools
RUN node tools/assemble-static.mjs --skip-install

FROM rust:1.99-bookworm AS server
WORKDIR /src
COPY languages/l0000/Cargo.toml languages/l0000/Cargo.lock ./
COPY languages/l0000/crates ./crates
RUN cargo build --release --locked -p l0000r-server

FROM gcr.io/distroless/cc-debian12:nonroot
WORKDIR /app
COPY --from=server /src/target/release/l0000r ./l0000r
COPY --from=static /src/static ./static
ENV STATIC_DIR=/app/static
EXPOSE 8080
CMD ["/app/l0000r"]
