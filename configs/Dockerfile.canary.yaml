# The scheduled canary (P1 #2, part B): scripts/canary.js as a Cloud Run job,
# run as canary-run@graffiticode. The canary shells out to gcloud (Secret
# Manager, Cloud Run, Cloud Logging, its own access token), so the runtime is
# Node plus the Cloud SDK; on Cloud Run, gcloud uses the job's identity from
# the metadata server. It loads @graffiticode/broker and @graffiticode/common
# from dist/, so the build stage runs the tsc build. The build context never
# contains dist/ (.dockerignore).
FROM node:22.23.3@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7 AS build
WORKDIR /usr/src/app
COPY . .
RUN npm ci && npm run build && npm prune --omit=dev

FROM node:22.23.3@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7 AS runtime

# The Cloud SDK, from Google's apt repository.
RUN apt-get update \
  && apt-get install -y --no-install-recommends apt-transport-https ca-certificates gnupg curl \
  && curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg \
  && echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" > /etc/apt/sources.list.d/google-cloud-sdk.list \
  && apt-get update \
  && apt-get install -y --no-install-recommends google-cloud-cli \
  && rm -rf /var/lib/apt/lists/*

WORKDIR /usr/src/app
ENV NODE_ENV=production
COPY --from=build /usr/src/app /usr/src/app

# The job supplies the arguments (--uid, --connection, --chain-admission, …).
ENTRYPOINT [ "node", "scripts/canary.js" ]
