# Lint and test every workspace package on push and pull request.
#
# Two jobs, so tests that need the Firebase emulators run in exactly one
# emulator session and everything else runs without it. Each jest target's
# skips are checked on their own (scripts/check-skips.js): a suite that
# silently skips (e.g. one gated on FIRESTORE_EMULATOR_HOST) fails its job.
# Targets and per-target skip allowlists live in scripts/test-targets.json.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: |
          npm run lint
          npm run lint --workspaces --if-present
      - name: Build (tsc -b, emits packages/*/dist)
        run: npm run build
      - name: Typecheck (checkJs, no emit)
        run: npm run typecheck
      - name: Unit tests (no emulator)
        run: npm run test:unit
      - name: Specs against the compiled output (no emulator)
        run: npm run test:compiled
      - name: Deploy CLI tests
        run: npm run test:deploy
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jest-results-unit
          path: .jest-results/
          if-no-files-found: ignore

  emulated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Firestore and Auth emulators run on the JVM.
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Packages load @graffiticode/common from its dist/ (phase 2b), so build
      # before any test.
      - name: Build
        run: npm run build
      - name: Emulator tests (one session)
        run: npm run test:ci:emulated
      - name: Specs against the compiled output (one emulator session)
        run: npm run test:ci:compiled-emulated
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jest-results-emulated
          path: .jest-results/
          if-no-files-found: ignore

  # Builds each service's production image exactly as Cloud Build will
  # (multi-stage; tsc runs inside the build stage) and checks that the image
  # holds precisely the packages/<name>/dist directories that service loads,
  # and that its entry point is there. Services already switched to dist/
  # (phase 2b) with a `port` are also started with their real CMD and must
  # answer GET / with 200 (policy and broker need KMS to start, so they are
  # proven at the candidate instead).
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dists: common auth
            entry: packages/auth/dist/main.js
            port: 4100
          - service: policy
            dists: common auth policy
            entry: packages/policy/src/main.js
          - service: broker
            dists: common policy broker
            entry: packages/broker/src/main.js
          - service: api
            dists: common auth policy broker api
            entry: packages/api/src/main.js
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build ${{ matrix.service }} image
        run: docker build -f configs/Dockerfile.${{ matrix.service }}.yaml -t gc-${{ matrix.service }} .
      - name: Check image contents
        run: |
          expected=$(for p in ${{ matrix.dists }}; do echo "packages/$p/dist"; done | sort)
          actual=$(docker run --rm --entrypoint sh gc-${{ matrix.service }} -c 'ls -d packages/*/dist 2>/dev/null' | sort)
          echo "expected dist dirs:"; echo "$expected"; echo "actual dist dirs:"; echo "$actual"
          test "$expected" = "$actual"
          for p in ${{ matrix.dists }}; do
            docker run --rm --entrypoint sh gc-${{ matrix.service }} -c "ls packages/$p/dist/*.js >/dev/null"
          done
          docker run --rm --entrypoint sh gc-${{ matrix.service }} -c 'test -f ${{ matrix.entry }}'
      - name: Start ${{ matrix.service }} with its real CMD
        if: matrix.port
        run: |
          docker run -d --name svc -e PORT=${{ matrix.port }} -p ${{ matrix.port }}:${{ matrix.port }} gc-${{ matrix.service }}
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ matrix.port }}/ || true)
            if [ "$code" = 200 ]; then echo "ready after ${i}s"; docker rm -f svc; exit 0; fi
            sleep 1
          done
          docker logs svc; docker rm -f svc; exit 1
